name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS on Apple silicon is the supported platform.
    name: Typecheck, lint, build and tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install -g npm@11.12.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:portable
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:rpc
      - run: npm run test:integration

  check-linux:
    # Linux is not a supported desktop platform; this job keeps the host,
    # adapter and test suites portable. CLI open/serve tests skip off macOS.
    name: Typecheck, lint, build and tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install -g npm@11.12.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:rpc
      - run: npm run test:integration

  e2e:
    name: Playwright journeys (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install -g npm@11.12.1
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
